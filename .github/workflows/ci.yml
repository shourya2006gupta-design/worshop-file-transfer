name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Health Check Smoke Test
        run: |
          cd backend
          node server.js &
          SERVER_PID=$!
          sleep 2
          curl -s http://localhost:5001/api/health | grep -q "QuickShare"
          kill $SERVER_PID
